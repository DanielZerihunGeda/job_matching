services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PARSER_URL: http://parser:8081/parse
      URI: postgresql://postgres:postgres@db:5432/job_matching
    depends_on:
      parser:
        condition: service_healthy
      db:
        condition: service_healthy

  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_matching
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_matching"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
